AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AWS Serverless Quarkus HTTP - nutri-backend-1.0.0

Parameters:
  AnthropicApiKey:
    Type: String
    NoEcho: true
  SupabaseUrl:
    Type: String
  SupabaseUser:
    Type: String
  SupabasePassword:
    Type: String
    NoEcho: true
  SupabaseJwtIssuer:
    Type: String
    Description: e.g. https://<project-ref>.supabase.co/auth/v1
  CorsOrigins:
    Type: String
    Default: '*'
    Description: Comma-separated list. In prod, set to your frontend domain only.
  CronSecret:
    Type: String
    NoEcho: true
    Description: Shared secret for /cron/* endpoints (kill-switch-check). Generate with openssl rand -hex 32.
  KillswitchDailyUsd:
    Type: String
    Default: '50'
    Description: Trip the kill switch if rolling-24h Claude spend exceeds this many USD.

Globals:
  Api:
    EndpointConfiguration: REGIONAL
    BinaryMediaTypes:
      - "*/*"

Resources:
  NutriBackendNative:
    Type: AWS::Serverless::Function
    Properties:
      Handler: not.used.in.provided.runtime
      Runtime: provided.al2023
      CodeUri: target/function.zip
      MemorySize: 512
      Policies: AWSLambdaBasicExecutionRole
      Timeout: 15
      Environment:
        Variables:
          DISABLE_SIGNAL_HANDLERS: true
          ANTHROPIC_API_KEY: !Ref AnthropicApiKey
          SUPABASE_DB_URL: !Ref SupabaseUrl
          SUPABASE_DB_USER: !Ref SupabaseUser
          SUPABASE_DB_PASSWORD: !Ref SupabasePassword
          SUPABASE_JWT_ISSUER: !Ref SupabaseJwtIssuer
          CORS_ORIGINS: !Ref CorsOrigins
          CRON_SECRET: !Ref CronSecret
          KILLSWITCH_DAILY_USD: !Ref KillswitchDailyUsd
      Events:
        HttpApiEvent:
          Type: HttpApi
        KillSwitchCheck:
          Type: Schedule
          Properties:
            Name: nutri-kill-switch-check
            Description: Hourly check — auto-trip kill switch if 24h Claude spend exceeds threshold.
            Schedule: rate(1 hour)
            Enabled: true
            Input: !Sub |
              {
                "version": "2.0",
                "routeKey": "POST /cron/kill-switch-check",
                "rawPath": "/cron/kill-switch-check",
                "rawQueryString": "",
                "headers": {
                  "x-cron-secret": "${CronSecret}",
                  "content-type": "application/json",
                  "content-length": "0"
                },
                "requestContext": {
                  "accountId": "scheduled",
                  "apiId": "scheduled",
                  "domainName": "scheduled.invoke",
                  "domainPrefix": "scheduled",
                  "http": {
                    "method": "POST",
                    "path": "/cron/kill-switch-check",
                    "protocol": "HTTP/1.1",
                    "sourceIp": "127.0.0.1",
                    "userAgent": "EventBridge-Scheduled-Invoke"
                  },
                  "requestId": "scheduled",
                  "routeKey": "POST /cron/kill-switch-check",
                  "stage": "$default",
                  "time": "01/Jan/2024:00:00:00 +0000",
                  "timeEpoch": 1704067200000
                },
                "isBase64Encoded": false
              }

Outputs:
  NutriBackendNativeApi:
    Description: URL for application
    Value: !Sub 'https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/'
    Export:
      Name: NutriBackendNativeApi
