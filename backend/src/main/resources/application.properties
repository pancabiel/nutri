# ---------- Auth (Supabase JWT) ----------
# HS256 shared secret from Supabase dashboard > Project Settings > API > JWT Secret
supabase.jwt-secret=${SUPABASE_JWT_SECRET:}
# Optional but recommended: lock issuer to your project — looks like https://<ref>.supabase.co/auth/v1
supabase.jwt-issuer=${SUPABASE_JWT_ISSUER:}
# Service-role key (server-side only). Required for admin operations like deleting users (LGPD).
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
supabase.project-url=${SUPABASE_PROJECT_URL:}

# ---------- HTTP ----------
quarkus.http.cors=true
# Comma-separated origins. In prod set to your domain only, e.g. https://nutri.app
quarkus.http.cors.origins=${CORS_ORIGINS:*}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,content-type,authorization

# ---------- Datasource (Supabase Postgres) ----------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/postgres}
quarkus.datasource.username=${SUPABASE_DB_USER:postgres}
quarkus.datasource.password=${SUPABASE_DB_PASSWORD:postgres}
quarkus.datasource.jdbc.max-size=4
quarkus.datasource.jdbc.min-size=0
# Supabase pooler (PgBouncer in transaction mode) reuses backend sessions across
# clients, which collides with PG JDBC's server-side prepared-statement cache
# ("prepared statement S_1 already exists"). Disabling the cache fixes it.
quarkus.datasource.jdbc.additional-jdbc-properties.prepareThreshold=0

# ---------- Anthropic ----------
quarkus.rest-client.anthropic.url=https://api.anthropic.com
anthropic.api-key=${ANTHROPIC_API_KEY:}
# Haiku for text parsing (cheap, sufficient); Sonnet only for vision (where quality matters).
anthropic.model.chat=claude-haiku-4-5
anthropic.model.vision=claude-sonnet-4-6
anthropic.max-tokens=2048

# ---------- Cron / kill switch ----------
# Shared secret for cron endpoints — required for X-Cron-Secret header on /cron/*.
cron.secret=${CRON_SECRET:}
# Auto-trip the global kill switch if rolling-24h Claude spend exceeds this many USD.
killswitch.daily-usd-threshold=${KILLSWITCH_DAILY_USD:500}
killswitch.window-hours=24

# ---------- Native / Lambda ----------
quarkus.native.resources.includes=prompts/*.txt
quarkus.lambda.handler=default

# ---------- Logging ----------
quarkus.log.level=INFO
quarkus.log.category."com.nutri".level=DEBUG
